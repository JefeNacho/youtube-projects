; Recolector de audio: manda el sonido de los micrófonos por el puerto serie
; para que `edge-impulse-data-forwarder` lo suba a Edge Impulse Studio.
; (Solo se usa para grabar tu dataset; NO es la wake word.)

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; 2000000 baudios: necesarios para mandar 16 000 muestras por segundo como texto
monitor_speed = 2000000
upload_speed = 921600

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

build_flags =
    -O3
    -DBOARD_HAS_PSRAM
    ; 0 = el monitor serial sale por el puerto "UART" (el chip CH343 de la placa).
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DESP32S3
