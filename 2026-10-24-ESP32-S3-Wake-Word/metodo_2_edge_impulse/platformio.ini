; Método 2: Wake Word con una red neuronal de Edge Impulse (TinyML, multiusuario)
; Placa probada: ESP32-S3 N16R8 (16 MB de flash y 8 MB de PSRAM octal)

[env:esp32s3]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.partitions = default_16MB.csv

; El modelo de Edge Impulse está en lib/wake_word_inferencing: PlatformIO lo encuentra solo.
lib_deps = adafruit/Adafruit NeoPixel@^1.12.3

build_flags =
    -O3
    -DESP32S3
    ; 0 = el monitor serial sale por el puerto "UART" (el chip CH343 de la placa).
    ; Si tu placa solo tiene el puerto USB nativo, cámbialo a 1.
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; IMPORTANTE: desactiva las instrucciones aceleradas "ESP-NN". Con ellas activadas, en esta
    ; placa el modelo daba resultados distintos a los de Edge Impulse Studio (37 % en una toma
    ; que el Studio calificaba con 100 %). Sin ellas coincide. No lo quites.
    -DEI_CLASSIFIER_TFLITE_ENABLE_ESP_NN=0
