; Método 1: Wake Word con MFCC + DTW (reconoce solo tu voz)
; Placa probada: ESP32-S3 N16R8 (16 MB de flash y 8 MB de PSRAM)

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
; qio_opi = flash normal + PSRAM octal (así viene la placa N16R8)
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

build_flags =
    -O3
    -DBOARD_HAS_PSRAM
    ; 0 = el monitor serial sale por el puerto "UART" (el chip CH343 de la placa).
    ; Si tu placa solo tiene el puerto USB nativo, cámbialo a 1.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DESP32S3
